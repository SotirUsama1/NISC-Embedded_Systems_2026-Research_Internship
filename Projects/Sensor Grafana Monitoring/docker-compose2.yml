services:
  # ── InfluxDB 3 Core (time-series database) ───────────────
  influxdb3:
    image: quay.io/influxdb/influxdb3-core:latest
    container_name: influxdb3
    networks:
      - monitoring
    ports:
      - "8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3
    command:
      - serve
      - --node-id=local01
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --http-bind=0.0.0.0:8181
      - --without-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── InfluxDB 3 Explorer (admin UI) ─────────────────────
  explorer:
    image: influxdata/influxdb3-ui
    container_name: influxdb3-explorer
    networks:
      - monitoring
    ports:
      - "8888:8080"
    command:
      - --api-url=http://influxdb3:8181
    depends_on:
      influxdb3:
        condition: service_healthy
    restart: unless-stopped

  # ── Grafana (monitoring dashboards) ─────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    networks:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Completely bypass any injected proxies for internal IPs
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=influxdb3,172.18.0.2,localhost,127.0.0.1
    # Hardwire the DNS to bypass the broken 10.255.255.254 resolver
    extra_hosts:
      - "influxdb3:172.18.0.2"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb3:
        condition: service_healthy
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
    # Removed the static IPAM block to prevent WSL/Network conflicts

volumes:
  influxdb3-data:
  grafana-data: