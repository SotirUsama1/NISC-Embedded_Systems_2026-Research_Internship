services:
  # ── InfluxDB 3 Core (time-series database) ───────────────
  influxdb3:
    image: quay.io/influxdb/influxdb3-core:latest
    container_name: influxdb3
    ports:
      - "8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3
    command:
      - serve
      - --node-id=local01
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --http-bind=0.0.0.0:8181
      - --without-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── InfluxDB 3 Explorer (admin UI) ─────────────────────
  explorer:
    image: influxdata/influxdb3-ui
    container_name: influxdb3-explorer
    ports:
      - "8888:8080"
    command:
      - --api-url=http://host.docker.internal:8181
    depends_on:
      influxdb3:
        condition: service_healthy
    restart: unless-stopped

  # ── Grafana (monitoring dashboards) ─────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      influxdb3:
        condition: service_healthy
    restart: unless-stopped

# ── Persistent volumes ─────────────────────────────────────
volumes:
  influxdb3-data:
  grafana-data:
